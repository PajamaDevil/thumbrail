name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (leave empty for a test build)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Pick version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Thumbrail.app
        run: VERSION="${{ steps.version.outputs.version }}" bash Scripts/make-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Thumbrail
          path: build/Thumbrail-*.zip

      - name: Publish GitHub release
        if: steps.version.outputs.version != '0.0.0-dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh release create "$TAG" build/Thumbrail-*.zip \
            --target "$GITHUB_SHA" --title "Thumbrail $TAG" --generate-notes
